name: Release quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          JWT_SECRET: ci-only-dummy-signing-secret-not-for-deployment
          UPSTASH_REDIS_REST_URL: https://example.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-only-placeholder
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser and HTTP regression checks
        working-directory: frontend
        env:
          JWT_SECRET: browser-test-only-strong-secret-should-never-be-deployed
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3401 > /tmp/vedika-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3401/login > /dev/null; then break; fi
            sleep 1
          done
          node tests/http-smoke.cjs
          npm run test:browser
      - run: python -m compileall -q backend

      - run: python -m unittest discover -s backend/tests -v
